name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  # 손으로 돌릴 수 있게 열어 둔다. 머지했는데 실행이 안 잡히는 일이 실제로 있었고
  # (2026-08-07 Actions 장애 — push 이벤트가 통째로 유실됐다) 그때 다시 굴릴 방법이
  # 없었다. 배포만 다시 태우고 싶을 때도 쓴다.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate i18n
        run: npm run i18n:generate

      # 서식은 prettier 기본값이 정한다 — prettier.config.js 를 비워 둔 게 그 결정이다.
      # 여기서 막지 않으면 다시 파일마다 제각각이 되어 diff 에 잡음이 섞인다.
      # 로컬에서 고치는 법: npm run format
      - name: Format
        run: npm run format:check

      # 계층(FSD)과 나머지 규칙을 나눠 둔 건 정리 중이던 시절의 잔재가 아니다 —
      # `lint:fsd` 는 `--no-inline-config` 로 돌아 계층 위반을 주석으로 못 덮는다.
      # 로컬에서 확인하는 법: npm run lint:fsd
      - name: FSD Layers
        run: npm run lint:fsd

      # 에러 0 · 경고 0 에서 잠근다. 여기서 막지 않으면 그 상태가 유지되지 않는다.
      # `--max-warnings 0` 이 핵심이다 — 경고는 쌓여도 CI 가 안 깨지므로, 세지 않으면
      # 다시 수십 개가 된다(실제로 28 개까지 갔다).
      # 로컬에서 확인하는 법: npm run lint
      - name: Lint
        run: npm run lint -- --max-warnings 0

      # 자격증명 입력칸이 다시 평문으로 벗겨지는 회귀를 여기서 잡는다.
      # 게이트가 살아 있는지(tests/fsd-boundaries)도 여기서 확인한다.
      # 빌드보다 먼저 둔다 — 몇 초짜리라 깨졌을 때 빨리 안다.
      - name: Test
        run: npm test

      # 타입 검사까지 돌린다 — 예전엔 build:skip-check 라 CI 는 통과하고
      # 배포 빌드에서만 터졌다(#191).
      - name: Build Test
        run: npm run build

  trigger-deploy:
    needs: build-test
    # PR 만 빼면 된다. `== 'push'` 로 못 박으면 수동 실행이 빌드만 하고 끝나
    # 정작 필요한 배포를 건너뛴다.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins Deploy
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          # 토큰은 Jenkins 잡 설정에만 있는 값이다. 레포에 적어 두면 그걸 아는 사람 누구나
          # 인증 없이 배포를 걸 수 있다 — Jenkins 는 인터넷에서 열려 있다.
          DEPLOY_TOKEN: ${{ secrets.JENKINS_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          # 시크릿에 줄바꿈이나 공백이 딸려 오면 curl 이 URL 을 못 읽는다(exit 3).
          # 값이 마스킹돼 로그로는 안 보이니 여기서 털어 낸다.
          BASE="$(printf '%s' "${JENKINS_URL}" | tr -d '[:space:]')"
          BASE="${BASE%/}"
          case "${BASE}" in
            http://*|https://*) ;;
            "") echo "::error::JENKINS_URL 이 비어 있습니다."; exit 1 ;;
            *) echo "::error::JENKINS_URL 은 http:// 또는 https:// 로 시작해야 합니다."; exit 1 ;;
          esac
          # 토큰도 같은 사고를 당한다 — 붙여넣다 딸려 온 줄바꿈이 쿼리스트링에 그대로 들어간다.
          TOKEN="$(printf '%s' "${DEPLOY_TOKEN}" | tr -d '[:space:]')"
          # 빈 토큰으로 부르면 Jenkins 가 404 를 주고 curl -f 가 잡지만, 로그만 보면
          # 원인이 URL 오타인지 토큰 미설정인지 알 수 없다. 여기서 이름을 대고 죽는다.
          if [ -z "${TOKEN}" ]; then
            echo "::error::JENKINS_DEPLOY_TOKEN 시크릿이 비어 있습니다."
            exit 1
          fi
          # -f 가 없으면 404·500 에도 curl 이 0 을 돌려준다. 토큰을 틀리게 적어도
          # 초록불이 뜨고 배포는 안 되는 상태가 되므로, HTTP 오류를 실패로 받는다.
          curl -fsS -X POST "${BASE}/generic-webhook-trigger/invoke?token=${TOKEN}"
